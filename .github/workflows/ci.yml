name: Validate

on:
  push: {}

permissions:
  contents: read

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-22.04, label: ubuntu22, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04, label: ubuntu22, target: x86_64-unknown-linux-musl, use-cross: true }
          - { os: macos-latest, label: macos, target: aarch64-apple-darwin }
          - { os: windows-latest, label: windows, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.job.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action
        with:
          toolchain: nightly-2026-09-25
          targets: ${{ matrix.job.target }}
          components: rustfmt, clippy

      - name: Install cross
        if: ${{ matrix.job.use-cross }}
        run: cargo install cross --version 0.2.5 --locked

      - name: Run cargo check
        if: ${{ matrix.job.target == 'x86_64-unknown-linux-gnu' }}
        run: cargo check --locked

      - name: Run cargo fmt
        if: ${{ matrix.job.target == 'x86_64-unknown-linux-gnu' }}
        run: cargo fmt --all -- --check

      - name: Run cargo clippy (cross)
        if: ${{ matrix.job.use-cross }}
        run: cross clippy --locked --release --target ${{ matrix.job.target }} -- -D warnings

      - name: Run cargo clippy
        if: ${{ !matrix.job.use-cross }}
        run: cargo clippy --locked --release --target ${{ matrix.job.target }} -- -D warnings

      - name: Run cargo test (cross)
        if: ${{ matrix.job.use-cross }}
        run: cross test --locked --release --target ${{ matrix.job.target }}

      - name: Run cargo test
        if: ${{ !matrix.job.use-cross }}
        run: cargo test --locked --release --target ${{ matrix.job.target }}

      - name: Run offline suite with loopback-only networking
        if: ${{ matrix.job.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          cargo fetch --locked
          sudo unshare --net bash -c 'ip link set lo up; exec sudo -u "$1" env PATH="$2" RUSTUP_HOME="$3" CARGO_HOME="$4" cargo test --locked --offline' bash "$(id -un)" "$PATH" "$HOME/.rustup" "$HOME/.cargo"

      - name: Build Release (cross)
        if: ${{ matrix.job.use-cross }}
        run: cross build --locked --release --target ${{ matrix.job.target }}

      - name: Build Release
        if: ${{ !matrix.job.use-cross }}
        run: cargo build --locked --release --target ${{ matrix.job.target }}

      - name: Smoke built artifact
        shell: bash
        run: |
          BINARY="target/${{ matrix.job.target }}/release/cncli"
          if [[ "${{ matrix.job.target }}" == *-pc-windows-* ]]; then BINARY+=".exe"; fi
          "$BINARY" --version
          "$BINARY" --help

      - name: Package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.job.target }}
          LABEL: ${{ matrix.job.label }}
        run: |
          if [[ "$TARGET" == *-pc-windows-* ]]; then PYTHON=python; else PYTHON=python3; fi
          IFS=$' \t\r' read -r PROJECT_NAME PROJECT_VERSION < <("$PYTHON" -c 'import json,subprocess; m=json.loads(subprocess.check_output(["cargo","metadata","--locked","--no-deps","--format-version","1"])); p=next(p for p in m["packages"] if p["name"]=="cncli"); print(p["name"],p["version"])')
          if [[ "$TARGET" == *-pc-windows-* ]]; then PKG_SUFFIX=".zip"; else PKG_SUFFIX=".tar.gz"; fi
          PKG_NAME="${PROJECT_NAME}-${PROJECT_VERSION}-${LABEL}-${TARGET}${PKG_SUFFIX}"
          if [[ "$TARGET" == *-pc-windows-* ]]; then
            7z -y a "$PKG_NAME" "./target/$TARGET/release/cncli.exe"
          else
            tar -C "target/$TARGET/release" -czf "$PKG_NAME" cncli
          fi
          export PKG_NAME
          "$PYTHON" - <<'PY'
          import hashlib, os, pathlib
          archive = pathlib.Path(os.environ["PKG_NAME"])
          digest = hashlib.sha256()
          with archive.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          archive.with_name(archive.name + ".sha256").write_text(f"{digest.hexdigest()}  {archive.name}\n")
          PY
          printf 'PKG_NAME=%s\nPKG_PATH=%s\n' "$PKG_NAME" "$PKG_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.PKG_NAME }}
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.PKG_PATH }}
            ${{ steps.package.outputs.PKG_PATH }}.sha256

  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action
        with:
          toolchain: nightly-2026-09-25

      - name: Download all target artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true

      - name: Verify complete artifact set and checksums
        id: verified
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          metadata = json.loads(subprocess.check_output(["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"]))
          package = next(p for p in metadata["packages"] if p["name"] == "cncli")
          targets = [
              ("ubuntu22", "x86_64-unknown-linux-gnu", ".tar.gz"),
              ("ubuntu22", "x86_64-unknown-linux-musl", ".tar.gz"),
              ("macos", "aarch64-apple-darwin", ".tar.gz"),
              ("windows", "x86_64-pc-windows-msvc", ".zip"),
          ]
          names = [f'{package["name"]}-{package["version"]}-{label}-{target}{suffix}' for label, target, suffix in targets]
          directory = pathlib.Path("dist")
          expected = set(names + [name + ".sha256" for name in names])
          actual = {path.name for path in directory.iterdir()}
          if actual != expected or any(not path.is_file() or path.is_symlink() for path in directory.iterdir()):
              raise SystemExit(f"Unexpected artifact set: missing={sorted(expected - actual)}, extra={sorted(actual - expected)}")
          for name in names:
              digest = hashlib.sha256()
              with (directory / name).open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              expected_sidecar = f"{digest.hexdigest()}  {name}\n"
              if (directory / (name + ".sha256")).read_text() != expected_sidecar:
                  raise SystemExit(f"Checksum mismatch: {name}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("archives<<CNCLI_VERIFIED_ARCHIVES\n")
              output.write("\n".join(str(directory / name) for name in names))
              output.write("\nCNCLI_VERIFIED_ARCHIVES\n")
          PY

      - name: Attest verified archives
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.verified.outputs.archives }}

      - name: Retain actual provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -n "$BUNDLE_PATH" && test -s "$BUNDLE_PATH"
          cp -- "$BUNDLE_PATH" dist/cncli-provenance.jsonl

      - name: Upload verified release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cncli-verified-release
          if-no-files-found: error
          path: |
            ${{ steps.verified.outputs.archives }}
            dist/*.sha256
            dist/cncli-provenance.jsonl

      - name: Release verified set
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          files: |
            ${{ steps.verified.outputs.archives }}
            dist/*.sha256
            dist/cncli-provenance.jsonl
